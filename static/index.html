<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Chat - Terminal</title>
<style>
:root {
  --bg: #0d1117;
  --bg-alt: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --font-mono: "SF Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* Top bar */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
#topbar .title {
  font-weight: bold;
  color: var(--green);
  white-space: nowrap;
}
#topbar .title::before { content: "❯ "; color: var(--accent); }
#topbar label { color: var(--text-dim); font-size: 12px; }
#topbar select, #topbar input {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-family: var(--font-mono);
  font-size: 12px;
}
#topbar select:focus, #topbar input:focus { outline: 1px solid var(--accent); }
#topbar input[type="text"] { width: 180px; }
#topbar input[type="number"] { width: 60px; }
#topbar .spacer { flex: 1; }
#status {
  font-size: 12px;
  color: var(--text-dim);
  white-space: nowrap;
}
#status.ok { color: var(--green); }
#status.err { color: var(--red); }
#status.busy { color: var(--yellow); }
/* Chat area */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  scroll-behavior: smooth;
}
#chat::-webkit-scrollbar { width: 8px; }
#chat::-webkit-scrollbar-track { background: var(--bg); }
#chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.msg { margin-bottom: 16px; white-space: pre-wrap; word-wrap: break-word; }
.msg .role {
  display: block;
  font-weight: bold;
  margin-bottom: 4px;
}
.msg.user .role { color: var(--accent); }
.msg.user .role::before { content: "❯ "; }
.msg.assistant .role { color: var(--green); }
.msg.assistant .role::before { content: "◈ "; }
.msg.error .role { color: var(--red); }
.msg.error .role::before { content: "✖ "; }
.msg .content { color: var(--text); }
.msg.error .content { color: var(--red); }
.thinking {
  color: var(--text-dim);
  font-style: italic;
  border-left: 3px solid var(--yellow);
  padding-left: 12px;
  margin-bottom: 8px;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.thinking .think-label {
  color: var(--yellow);
  font-weight: bold;
  font-style: normal;
  display: block;
  margin-bottom: 4px;
}
.thinking .think-label::before { content: "🧠 "; }
.cursor {
  display: inline-block;
  width: 8px;
  height: 16px;
  background: var(--green);
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }
/* Input area */
#inputbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--bg-alt);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#prompt { color: var(--green); font-weight: bold; white-space: nowrap; }
#prompt::before { content: "❯ "; color: var(--accent); }
#input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 14px;
  outline: none;
  resize: none;
  max-height: 120px;
  line-height: 1.6;
}
#input::placeholder { color: var(--text-dim); }
#sendbtn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 6px 16px;
  font-family: var(--font-mono);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
#sendbtn:hover { filter: brightness(1.1); }
#sendbtn:disabled { background: var(--border); cursor: not-allowed; }
#stopbtn {
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 6px 16px;
  font-family: var(--font-mono);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  display: none;
}
#stopbtn:hover { filter: brightness(1.1); }
/* Settings panel */
#settings {
  display: none;
  padding: 12px 16px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
#settings.open { display: flex; }
#settings label { color: var(--text-dim); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
#settings input, #settings textarea {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 8px;
  font-family: var(--font-mono);
  font-size: 12px;
}
#settings textarea { width: 100%; min-height: 60px; resize: vertical; }
#settings .field { flex: 1; min-width: 150px; }
#settings .field.wide { flex-basis: 100%; }
#settingsbtn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: pointer;
}
#settingsbtn:hover { color: var(--text); border-color: var(--text-dim); }
#settingsbtn.active { color: var(--accent); border-color: var(--accent); }
/* Capability bar */
#capbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 16px;
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
#capbar .cap-label { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
.cap-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-dim);
  white-space: nowrap;
}
.cap-badge.on { color: var(--green); border-color: var(--green); }
.cap-badge.off { opacity: 0.45; }
/* Mic upload */
#micbtn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 10px;
  font-family: var(--font-mono);
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
#micbtn:hover { color: var(--text); border-color: var(--text-dim); }
#micbtn.recording { color: var(--red); border-color: var(--red); background: rgba(248, 81, 73, 0.1); }
#attachbtn:disabled, #micbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.audio-chip {
  display: inline-block;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 12px;
  white-space: nowrap;
}
/* Image upload */
#attachbtn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 10px;
  font-family: var(--font-mono);
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
}
#attachbtn:hover { color: var(--text); border-color: var(--text-dim); }
#previewbar {
  display: none;
  padding: 8px 16px;
  background: var(--bg-alt);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#previewbar.open { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#previewbar .attach-hint {
  color: var(--text-dim);
  font-size: 12px;
}
.preview-item {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px;
  display: inline-block;
}
.preview-item img {
  display: block;
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: 3px;
}
.preview-item .remove {
  position: absolute;
  top: -7px;
  right: -7px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* Images inside messages */
.msg .images { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.msg .images img {
  max-width: 220px;
  max-height: 220px;
  border: 1px solid var(--border);
  border-radius: 6px;
}
/* Drag overlay */
body.dragover::after {
  content: "Drop image here";
  position: fixed;
  inset: 0;
  background: rgba(13, 17, 23, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: bold;
  color: var(--green);
  border: 3px dashed var(--green);
  z-index: 999;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="topbar">
  <span class="title">ollama-chat</span>
  <label>Model</label>
  <select id="modelSelect"></select>
  <label>Ollama URL</label>
  <input type="text" id="ollamaUrl" value="http://localhost:11434" placeholder="http://localhost:11434">
  <label>Temp</label>
  <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
  <button id="settingsbtn" title="Cài đặt nâng cao">⚙</button>
  <div class="spacer"></div>
  <span id="status">Đang kết nối...</span>
</div>

<div id="settings">
  <div class="field wide">
    <label>System Prompt
      <textarea id="systemPrompt" placeholder="You are a helpful assistant.">You are a helpful assistant.</textarea>
    </label>
  </div>
</div>

<div id="capbar">
  <span class="cap-label">Khả năng:</span>
  <span class="cap-badge" data-cap="vision">👁 Vision</span>
  <span class="cap-badge" data-cap="tools">🔧 Tools</span>
  <span class="cap-badge" data-cap="thinking">🧠 Thinking</span>
  <span class="cap-badge" data-cap="audio">🎤 Audio</span>
</div>

<div id="chat"></div>

<div id="previewbar">
  <span class="attach-hint">📎 Hình ảnh đã chọn</span>
</div>

<div id="inputbar">
  <span id="prompt">user@local</span>
  <button id="attachbtn" title="Đính kèm ảnh (drag/drop cũng được)">📎</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <button id="micbtn" title="Ghi âm giọng nói">🎤</button>
  <textarea id="input" rows="1" placeholder="Nhập tin nhắn... (Enter để gửi, Shift+Enter để xuống dòng)"></textarea>
  <button id="sendbtn">Gửi</button>
  <button id="stopbtn">Dừng</button>
</div>
<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendbtn');
const stopBtn = document.getElementById('stopbtn');
const modelSelect = document.getElementById('modelSelect');
const ollamaUrlInput = document.getElementById('ollamaUrl');
const tempInput = document.getElementById('temperature');
const statusEl = document.getElementById('status');
const settingsBtn = document.getElementById('settingsbtn');
const settingsPanel = document.getElementById('settings');
const systemPromptEl = document.getElementById('systemPrompt');

const attachBtn = document.getElementById('attachbtn');
const fileInput = document.getElementById('fileInput');
const previewBar = document.getElementById('previewbar');
const micBtn = document.getElementById('micbtn');
const capBadges = document.querySelectorAll('.cap-badge');

let messages = [];
let isStreaming = false;
let abortController = null;
let pendingImages = [];
let pendingAudio = null;
let modelCaps = { vision: false, tools: false, thinking: false, audio: false };

let mediaRecorder = null;
let isRecording = false;
let recordedChunks = [];

// --- Image helpers ---
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function stripBase64Prefix(dataUrl) {
  const idx = dataUrl.indexOf(',');
  return idx >= 0 ? dataUrl.slice(idx + 1) : dataUrl;
}

// --- Model capabilities ---
async function loadModelInfo() {
  const model = modelSelect.value;
  if (!model) return;
  try {
    const resp = await fetch('/api/model-info', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ollama_url: ollamaUrlInput.value.trim() || 'http://localhost:11434',
        model: model
      })
    });
    const data = await resp.json();
    modelCaps = data.supports || modelCaps;
    updateCapabilities();
  } catch (e) {
    // keep previous state
  }
}

function updateCapabilities() {
  capBadges.forEach(badge => {
    const cap = badge.dataset.cap;
    badge.classList.toggle('on', !!modelCaps[cap]);
    badge.classList.toggle('off', !modelCaps[cap]);
  });
  attachBtn.disabled = !modelCaps.vision;
  micBtn.disabled = !modelCaps.audio;
}

// --- Audio recording ---
async function handleAudioBlob(blob) {
  const dataUrl = await fileToDataUrl(blob);
  const ext = blob.type.includes('mp4') ? 'm4a' : 'webm';
  pendingAudio = { name: 'audio.' + ext, dataUrl: dataUrl, b64: stripBase64Prefix(dataUrl) };
  renderPreview();
}

async function toggleRecording() {
  if (isRecording) {
    mediaRecorder && mediaRecorder.stop();
    return;
  }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setStatus('Trình duyệt không hỗ trợ ghi âm', 'err');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      if (blob.size > 0) await handleAudioBlob(blob);
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤';
      micBtn.title = 'Ghi âm giọng nói';
    };
    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹';
    micBtn.title = 'Dừng ghi âm';
  } catch (e) {
    setStatus('Không truy cập được microphone', 'err');
  }
}

async function handleFiles(files) {
  const arr = Array.from(files || []).filter(f => f.type.startsWith('image/'));
  if (arr.length === 0) return;
  for (const file of arr) {
    try {
      const dataUrl = await fileToDataUrl(file);
      pendingImages.push({ name: file.name, dataUrl: dataUrl, b64: stripBase64Prefix(dataUrl) });
    } catch (err) {
      console.error('File error', err);
    }
  }
  renderPreview();
}

function renderPreview() {
  previewBar.innerHTML = '';
  if (pendingImages.length === 0 && !pendingAudio) {
    previewBar.classList.remove('open');
    return;
  }
  pendingImages.forEach((img, i) => {
    const item = document.createElement('div');
    item.className = 'preview-item';
    const thumb = document.createElement('img');
    thumb.src = img.dataUrl;
    const rm = document.createElement('button');
    rm.className = 'remove';
    rm.textContent = 'x';
    rm.title = 'Xóa ảnh';
    rm.addEventListener('click', () => {
      pendingImages.splice(i, 1);
      renderPreview();
    });
    item.appendChild(thumb);
    item.appendChild(rm);
    previewBar.appendChild(item);
  });
  if (pendingAudio) {
    const item = document.createElement('div');
    item.className = 'preview-item';
    const chip = document.createElement('span');
    chip.className = 'audio-chip';
    chip.textContent = '🎤 ' + pendingAudio.name;
    const rm = document.createElement('button');
    rm.className = 'remove';
    rm.textContent = 'x';
    rm.title = 'Xóa audio';
    rm.addEventListener('click', () => {
      pendingAudio = null;
      renderPreview();
    });
    item.appendChild(chip);
    item.appendChild(rm);
    previewBar.appendChild(item);
  }
  previewBar.classList.add('open');
}

// --- Drag & drop ---
['dragenter', 'dragover'].forEach(evt => {
  document.addEventListener(evt, (e) => {
    e.preventDefault();
    document.body.classList.add('dragover');
  });
});
['dragleave', 'drop'].forEach(evt => {
  document.addEventListener(evt, (e) => {
    e.preventDefault();
    document.body.classList.remove('dragover');
  });
});
document.addEventListener('drop', (e) => {
  if (e.dataTransfer && e.dataTransfer.files) {
    handleFiles(e.dataTransfer.files);
  }
});

// --- Helpers ---
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessage(role, content, images, audioUrl) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const roleLabel = document.createElement('span');
  roleLabel.className = 'role';
  roleLabel.textContent = role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : 'error';
  const contentDiv = document.createElement('div');
  contentDiv.className = 'content';
  contentDiv.textContent = content;
  if (audioUrl) {
    const audioChip = document.createElement('span');
    audioChip.className = 'audio-chip';
    audioChip.textContent = '🎤 audio';
    contentDiv.appendChild(audioChip);
  }
  div.appendChild(roleLabel);
  div.appendChild(contentDiv);
  if (images && images.length > 0) {
    const imgWrap = document.createElement('div');
    imgWrap.className = 'images';
    images.forEach(dUrl => {
      const im = document.createElement('img');
      im.src = dUrl;
      imgWrap.appendChild(im);
    });
    div.appendChild(imgWrap);
  }
  chatEl.appendChild(div);
  scrollToBottom();
  return contentDiv;
}

function addStreamingMessage() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  const roleLabel = document.createElement('span');
  roleLabel.className = 'role';
  roleLabel.textContent = 'assistant';
  const thinkingDiv = document.createElement('div');
  thinkingDiv.className = 'thinking';
  thinkingDiv.style.display = 'none';
  const thinkLabel = document.createElement('span');
  thinkLabel.className = 'think-label';
  thinkLabel.textContent = 'thinking...';
  const thinkContent = document.createElement('span');
  thinkContent.className = 'think-content';
  thinkingDiv.appendChild(thinkLabel);
  thinkingDiv.appendChild(thinkContent);
  const contentDiv = document.createElement('div');
  contentDiv.className = 'content';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  contentDiv.appendChild(cursor);
  div.appendChild(roleLabel);
  div.appendChild(thinkingDiv);
  div.appendChild(contentDiv);
  chatEl.appendChild(div);
  scrollToBottom();
  return { div, thinkingDiv, thinkContent, contentDiv, cursor };
}

// --- Load models ---
async function loadModels() {
  const url = ollamaUrlInput.value.trim() || 'http://localhost:11434';
  setStatus('Đang tải models...', 'busy');
  try {
    const resp = await fetch('/api/models?url=' + encodeURIComponent(url));
    const data = await resp.json();
    modelSelect.innerHTML = '';
    if (data.models && data.models.length > 0) {
      data.models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modelSelect.appendChild(opt);
      });
      if (data.default && data.models.includes(data.default)) {
        modelSelect.value = data.default;
      }
      setStatus('Sẵn sàng', 'ok');
      loadModelInfo();
    } else {
      setStatus('Không tìm thấy model', 'err');
    }
  } catch (e) {
    setStatus('Lỗi kết nối Ollama', 'err');
  }
}

// --- Send message ---
async function sendMessage() {
  const text = inputEl.value.trim();
  if ((!text && pendingImages.length === 0 && !pendingAudio) || isStreaming) return;

  const msg = { role: 'user', content: text };
  const sentImages = [...pendingImages];
  const sentAudio = pendingAudio;
  let contentParts = [];
  if (text) contentParts.push({ type: 'text', text: text });
  sentImages.forEach(img => contentParts.push({ type: 'image', image: img.b64 }));
  if (sentAudio) contentParts.push({ type: 'audio', audio: sentAudio.b64 });
  if (sentAudio) {
    msg.content = contentParts;
  } else if (sentImages.length > 0) {
    msg.content = contentParts;
    msg.images = sentImages.map(img => img.b64);
  }

  addMessage('user', text, sentImages.map(img => img.dataUrl), sentAudio ? sentAudio.dataUrl : null);
  messages.push(msg);
  pendingImages = [];
  pendingAudio = null;
  renderPreview();
  inputEl.value = '';
  inputEl.style.height = 'auto';

  const { thinkingDiv, thinkContent, contentDiv, cursor } = addStreamingMessage();
  isStreaming = true;
  sendBtn.disabled = true;
  stopBtn.style.display = 'inline-block';
  setStatus('Đang trả lời...', 'busy');

  abortController = new AbortController();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ollama_url: ollamaUrlInput.value.trim() || 'http://localhost:11434',
        model: modelSelect.value,
        messages: messages,
        temperature: parseFloat(tempInput.value) || 0.7,
        system_prompt: systemPromptEl.value.trim()
      }),
      signal: abortController.signal
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || 'HTTP ' + resp.status);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let fullThinking = '';
    let buffer = '';
    let hasThinking = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // Process NDJSON lines from server
      let lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line in buffer
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const obj = JSON.parse(line);
          if (obj.t === 'think') {
            hasThinking = true;
            fullThinking += obj.d;
            thinkingDiv.style.display = 'block';
            thinkContent.textContent = fullThinking;
            scrollToBottom();
          } else if (obj.t === 'content') {
            fullText += obj.d;
            cursor.remove();
            contentDiv.textContent = fullText;
            scrollToBottom();
          }
        } catch (e) {
          // Not JSON - could be error text
          if (line.includes('[ERROR]')) {
            fullText += line;
          }
        }
      }
    }

    if (fullText.includes('[ERROR]')) {
      const errMsg = fullText.split('[ERROR]')[1].trim();
      contentDiv.textContent = errMsg;
      contentDiv.parentElement.className = 'msg error';
      setStatus('Lỗi', 'err');
    } else {
      messages.push({ role: 'assistant', content: fullText });
      setStatus('Sẵn sàng', 'ok');
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      contentDiv.textContent = (contentDiv.textContent || '') + '\n\n[Đã dừng]';
      setStatus('Đã dừng', 'ok');
    } else {
      contentDiv.textContent = e.message || 'Lỗi không xác định';
      contentDiv.parentElement.className = 'msg error';
      setStatus('Lỗi', 'err');
    }
  } finally {
    isStreaming = false;
    sendBtn.disabled = false;
    stopBtn.style.display = 'none';
    abortController = null;
    inputEl.focus();
  }
}

// --- Events ---
attachBtn.addEventListener('click', () => fileInput.click());
micBtn.addEventListener('click', toggleRecording);

modelSelect.addEventListener('change', loadModelInfo);

fileInput.addEventListener('change', () => {
  handleFiles(fileInput.files);
  fileInput.value = '';
});

sendBtn.addEventListener('click', sendMessage);

stopBtn.addEventListener('click', () => {
  if (abortController) abortController.abort();
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

ollamaUrlInput.addEventListener('change', loadModels);

settingsBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
  settingsBtn.classList.toggle('active');
});

// --- Init ---
updateCapabilities();
loadModels();
inputEl.focus();
</script>
</body>
