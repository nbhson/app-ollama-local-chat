<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ollama Chat</title>
<link rel="stylesheet" href="/static/style.css">
<!-- Vendored highlight.js themes: one enabled per theme, toggled in applyTheme(). -->
<link rel="stylesheet" href="/static/vendor/hljs-github-dark.min.css" id="hljsDark">
<link rel="stylesheet" href="/static/vendor/hljs-github.min.css" id="hljsLight" disabled>
</head>
<body>
<aside id="sidebar" aria-label="Conversations">
  <div class="sidebar-head">
    <span class="title">ollama-chat</span>
    <button id="sidebarClose" class="iconbtn" title="Close sidebar">✕</button>
  </div>
  <button id="newChatBtn" class="new-chat">＋ New chat</button>
  <div id="conversationList" class="conversation-list"></div>
  <div class="sidebar-footer">
    <label>Export
      <select id="exportSelect">
        <option value="" disabled selected>Export chat…</option>
        <option value="md">Markdown (.md)</option>
        <option value="json">JSON (.json)</option>
      </select>
    </label>
  </div>
</aside>
<div id="backdrop"></div>

<div id="main">
  <header id="topbar">
    <button id="sidebarToggle" class="iconbtn" title="Toggle conversations">☰</button>
    <label>Model</label>
    <select id="modelSelect"></select>
    <label>Ollama URL</label>
    <input type="text" id="ollamaUrl" value="http://localhost:11434" placeholder="http://localhost:11434">
    <label>Temp</label>
    <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
    <button id="settingsbtn" title="Advanced settings">⚙</button>
    <span class="spacer"></span>
    <span id="session-stats"></span>
    <span id="status">Connecting...</span>
    <button id="themeToggle" title="Toggle light/dark theme">🌙</button>
    <button id="md-toggle" title="Toggle markdown rendering (Ctrl+M)">Md</button>
  </header>

  <div id="settings">
    <div class="field">
      <label>Preset
        <select id="presetSelect"></select>
      </label>
    </div>
    <div class="field wide">
      <label>System Prompt
        <textarea id="systemPrompt" placeholder="You are a helpful assistant.">You are a helpful assistant.</textarea>
      </label>
    </div>
  </div>

  <div id="capbar">
    <span class="cap-label">Capabilities:</span>
    <span class="cap-badge" data-cap="vision">👁 Vision</span>
    <span class="cap-badge" data-cap="tools">🔧 Tools</span>
    <span class="cap-badge" data-cap="thinking">🧠 Thinking</span>
    <span class="cap-badge" data-cap="audio">🎤 Audio</span>
  </div>

  <div id="chat"></div>

  <div id="previewbar">
    <span class="attach-hint">📎 Selected images</span>
  </div>

  <div id="inputbar">
    <span id="prompt">user@local</span>
    <button id="addbtn" title="Attach file / record audio">＋</button>
    <span id="addmenu">
      <button id="attachbtn" title="Attach image (drag & drop works too)">📎 Image</button>
      <button id="micbtn" title="Record voice">🎤 Record</button>
    </span>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <textarea id="input" rows="1" placeholder="Type a message... (Enter to send, Shift+Enter for new line)"></textarea>
    <button id="sendbtn">Send</button>
    <button id="stopbtn">Stop</button>
  </div>
</div>
<!-- Vendored locally (static/vendor/) — see README "Updating vendored libraries".
     No third-party origins, so CSP stays script-src/style-src 'self'. -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
